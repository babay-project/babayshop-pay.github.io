    const account=x=>`<article class="account"><img src="${x.l}" alt="Logo ${x.n}"><div><strong>${x.n}</strong>${x.c?`<small>${x.c}</small>`:""}<b>${x.d}</b></div><button data-copy="${x.r}">Salin</button></article>`;
    const paymentDetail=m=>m==="qris"?`<div class="detail-inner"><div class="detail-image"><img src="${qris}" alt="QRIS Babayshop"><span>QRIS</span></div><h2>Scan QRIS</h2><p>Buka aplikasi pembayaran dan scan kode QR di kartu utama.</p></div>`:`<div class="detail-inner"><div class="detail-title"><span>${m==="ewallet"?"E-WALLET":"TRANSFER BANK"}</span><small>${(m==="ewallet"?wallets:banks).length} PILIHAN</small></div><h2>${m==="ewallet"?"Nomor E-Wallet":"Rekening Tujuan"}</h2><div class="accounts">${(m==="ewallet"?wallets:banks).map(account).join("")}</div></div>`;
    function render(view){document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===view));if(view==="admin")content.innerHTML=`<section class="panel focus"><div class="focus-heading"><span>ADMIN</span><h1>Babayshop Payment</h1></div><div class="admin-focus"><div class="admin-avatar"><img src="https://i.ibb.co.com/0jscDd0j/LOLO-BABAYSHOP-ID.png" alt="Logo Babayshop"></div><h2>Perlu bantuan?</h2><strong>0815 2398 4574</strong><p>Hubungi admin resmi BabayShop untuk bantuan pembayaran.</p><a href="https://wa.me/6281523984574" target="_blank" rel="noopener">Chat WhatsApp ↗</a></div></section>`;else if(view==="qris")content.innerHTML=`<section class="panel focus"><div class="focus-heading"><span>QRIS</span><h1>Babayshop Payment</h1></div><div class="focus-content"><div class="focus-qris"><img src="${qris}" alt="QRIS Babayshop.id"></div><div class="focus-info"><h2>Scan QRIS</h2><p>Buka aplikasi pembayaran, scan kode QR, lalu masukkan nominal transaksi.</p><div class="owner-card"><small>ATAS NAMA</small><strong>Babayshop.id</strong></div></div></div></section>`;else content.innerHTML=`<section class="panel focus"><div class="focus-heading"><span>${view==="ewallet"?"E-WALLET":"TRANSFER BANK"}</span><h1>Babayshop Payment</h1></div><div class="focus-content"><div class="focus-accounts">${paymentDetail(view)}</div></div></section>`;history.replaceState(null,"","#"+view);scrollTo({top:0,behavior:"smooth"})}
    document.addEventListener("click",async e=>{const v=e.target.closest("[data-view]");if(v)render(v.dataset.view);const b=e.target.closest("[data-copy]");if(b){try{await navigator.clipboard.writeText(b.dataset.copy);toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}catch{prompt("Salin nomor ini:",b.dataset.copy)}}});const initial=location.hash.slice(1);render(["qris","ewallet","bank","admin"].includes(initial)?initial:"qris");
  </script>
</body>
</html>
