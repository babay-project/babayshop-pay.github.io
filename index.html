<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="description" content="Halaman pembayaran resmi BabayShop.id melalui QRIS, e-wallet, dan transfer bank.">
  <title>BabayShop Payment</title>
  <link rel="icon" href="https://i.ibb.co.com/0jscDd0j/LOLO-BABAYSHOP-ID.png">

  <style>
    /* ==================== 1. DESIGN TOKENS ==================== */
    :root {
      color-scheme: dark;
      --bg: #242424;
      --surface: rgba(31, 31, 31, .88);
      --surface-strong: #222;
      --surface-soft: #303030;
      --line: rgba(255, 255, 255, .10);
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #f2f2f2;
      --accent-dark: #bdbdbd;
      --radius-lg: 28px;
      --radius-md: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 14% 16%, #555 0, transparent 34rem),
        radial-gradient(circle at 90% 88%, #3d3d3d 0, transparent 36rem),
        linear-gradient(145deg, #303030 0%, #222 48%, #292929 100%);
      background-attachment: fixed;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: .68;
      background-image:
        linear-gradient(rgba(255, 255, 255, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .08) 1px, transparent 1px);
      background-size: 34px 34px;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    img { display: block; max-width: 100%; }
    h1, h2, p { margin: 0; }

    /* ==================== 2. LAYOUT ==================== */
    .app-shell {
      width: min(720px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 18px 116px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding: 0 4px;
      animation: enter .55s ease both;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 46px;
      height: 46px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      object-fit: contain;
    }
    .brand small, .security-label { color: var(--muted); font-size: 12px; }
    .brand strong { display: block; margin-top: 2px; font-size: 15px; }
    .security-label { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .security-label::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      content: "";
    }

    .payment-card {
      position: relative;
      min-height: 610px;
      overflow: hidden;
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(34, 34, 34, .94), rgba(18, 18, 18, .96));
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .payment-card::after {
      position: absolute;
      top: -110px;
      right: -110px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .07);
      filter: blur(8px);
      content: "";
      pointer-events: none;
    }

    .view { position: relative; z-index: 1; animation: enter .38s ease both; }
    .view-header { margin-bottom: 30px; text-align: center; }
    .eyebrow {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    .view-header h1 { font-size: clamp(30px, 7vw, 48px); letter-spacing: -.055em; }
    .view-header p { margin-top: 9px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    /* ==================== 3. QRIS ==================== */
    .qris-layout {
      display: grid;
      grid-template-columns: minmax(220px, 310px) 1fr;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vw, 46px);
    }
    .qris-box {
      position: relative;
      padding: 12px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .4);
    }
    .qris-box::before {
      position: absolute;
      inset: -5px;
      z-index: -1;
      border: 1px solid rgba(255, 255, 255, .46);
      border-radius: 28px;
      content: "";
      animation: glow 2.6s ease-in-out infinite;
    }
    .qris-box img { width: 100%; aspect-ratio: 1; border-radius: 14px; object-fit: contain; }
    .instruction h2 { margin-bottom: 10px; font-size: 25px; letter-spacing: -.03em; }
    .instruction p { color: var(--muted); font-size: 14px; line-height: 1.65; }

    .owner-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 15px;
      background: rgba(255, 255, 255, .06);
    }
    .owner-icon { font-size: 22px; }
    .owner-box small { display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
    .owner-box strong { font-size: 13px; }

    /* ==================== 4. PAYMENT ACCOUNTS ==================== */
    .account-list { display: grid; gap: 12px; }
    .account {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, .035);
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .account:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, .34);
      background: rgba(255, 255, 255, .055);
    }
    .account-logo {
      width: 52px;
      height: 52px;
      padding: 6px;
      border-radius: 14px;
      background: white;
      object-fit: contain;
    }
    .account-name { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .account-name strong { font-size: 14px; }
    .bank-code { color: var(--muted); font-size: 10px; }
    .account-number { font-size: 14px; font-weight: 800; letter-spacing: .04em; }
    .account-owner { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .copy-button {
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--text);
      color: #09090b;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .copy-button:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 8px 18px rgba(0, 0, 0, .42); }
    .copy-button:active { transform: scale(.96); }

    /* ==================== 5. ADMIN ==================== */
    .admin-panel { max-width: 390px; margin: 72px auto 0; text-align: center; }
    .admin-logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      padding: 6px;
      border-radius: 26px;
      background: white;
      object-fit: contain;
    }
    .admin-panel h2 { font-size: 28px; }
    .admin-phone { display: block; margin: 10px 0; font-size: 19px; }
    .admin-panel p { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .whatsapp-button {
      display: inline-flex;
      margin-top: 22px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .whatsapp-button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 0, 0, .35); }

    /* ==================== 6. BOTTOM NAVIGATION ==================== */
    .bottom-nav {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(680px, calc(100% - 24px));
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(16, 16, 18, .86);
      box-shadow: 0 16px 42px rgba(0, 0, 0, .5);
      backdrop-filter: blur(22px);
      transform: translateX(-50%);
    }
    .nav-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      border: 1px solid #454545;
      background: linear-gradient(180deg, #373737, #242424);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px rgba(255, 255, 255, .12), inset 0 -3px 7px rgba(0, 0, 0, .5), 0 5px 10px rgba(0, 0, 0, .28);
      text-shadow: 0 1px 2px #000;
      transition: color .2s ease, background .2s ease, transform .15s ease, box-shadow .15s ease;
    }
    .nav-button:hover { color: var(--text); background: linear-gradient(180deg, #454545, #292929); transform: translateY(-2px); }
    .nav-button:active { transform: translateY(2px); box-shadow: inset 0 4px 9px rgba(0, 0, 0, .62); }
    .nav-button.active {
      color: #111;
      border-color: #fff;
      background: linear-gradient(180deg, #f4f4f4, #cfcfcf);
      box-shadow: inset 0 1px #fff, inset 0 -3px 6px rgba(0, 0, 0, .18), 0 4px 12px rgba(0, 0, 0, .4);
      text-shadow: none;
    }

    .toast {
      position: fixed;
      bottom: 88px;
      left: 50%;
      z-index: 20;
      padding: 12px 17px;
      border-radius: 12px;
      background: var(--text);
      color: #111;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      0%, 100% { opacity: .3; transform: scale(.99); }
      50% { opacity: 1; transform: scale(1.015); }
    }

    /* ==================== 7. RESPONSIVE ==================== */
    @media (max-width: 620px) {
      .app-shell { padding: 18px 12px 104px; }
      .hero { margin-bottom: 15px; }
      .security-label span { display: none; }
      .payment-card { min-height: calc(100dvh - 160px); padding: 26px 17px; border-radius: 23px; }
      .qris-layout { display: flex; flex-direction: column; }
      .qris-box { width: min(295px, 90%); }
      .instruction { width: 100%; text-align: center; }
      .owner-box { justify-content: center; text-align: left; }
      .account { grid-template-columns: 46px 1fr auto; gap: 10px; padding: 11px; }
      .account-logo { width: 46px; height: 46px; }
      .copy-button { padding: 0 12px; }
      .nav-button { font-size: 9px; }
    }

    @media (max-width: 390px) {
      .brand small { display: none; }
      .view-header { margin-bottom: 22px; }
      .account { grid-template-columns: 42px 1fr; }
      .account-logo { width: 42px; height: 42px; }
      .copy-button { grid-column: 1 / -1; width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand">
        <img class="brand-logo" src="https://i.ibb.co.com/0jscDd0j/LOLO-BABAYSHOP-ID.png" alt="Logo BabayShop">
        <div><small>Payment Center</small><strong>BabayShop.id</strong></div>
      </div>
     
    </header>

    <section class="payment-card" aria-live="polite">
      <div id="content"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Metode pembayaran">
    <button class="nav-button active" type="button" data-view="qris">QRIS</button>
    <button class="nav-button" type="button" data-view="ewallet">E-WALLET</button>
    <button class="nav-button" type="button" data-view="bank">BANK</button>
    <button class="nav-button" type="button" data-view="admin">ADMIN</button>
  </nav>

  <div class="toast" id="toast" role="status">✓ Nomor berhasil disalin</div>

  <script>
    /* ==================== DATA YANG MUDAH DIEDIT ==================== */
    const OWNER_NAME = "Bayu Rizky Sampurna";
    const QRIS_IMAGE = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiyn_POU24OHFf6f_ThdafRVVCDrG-GWihtCGBynkBUqn5AiKFRGvh_UVCT8cx9pOxbkH3w5NczLeo-MAH_1MVc8Qe-eAtEeAAW4-102vgrZVt_EJS980wpV_FTJ4MTdPg5jYEQOcCBTU374Kl5meMugCsI9rjWChWY6s_h7DjLQ3WiOxBAjbN6VL071gc/s1600/QRIS-BABAYSHOP-WEBSITE.png";
    const SHOP_LOGO = "https://i.ibb.co.com/0jscDd0j/LOLO-BABAYSHOP-ID.png";
    const ADMIN_PHONE_DISPLAY = "0815 2398 4574";
    const ADMIN_PHONE_WHATSAPP = "6281523984574";

    const ewalletAccounts = [
      { name: "GoPay", number: "0882 1599 3544", copy: "088215993544", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEgq3HaU8T7ZEEmljJuxypoDObOdQYkxB38dVJa1y89eUqFwHXe7kYE_y9xz5gv85e44cuMs0hLmUBXPRdf0VvYHlqZjgtYjCHmNFQjKc_5dZ3k67UOH2CmQAvtVOhDjgze941ZTwyehsrRDleoxR0Q-5fh-NtPMN0rVF77ObjtItBkc2rbEXboOgqD2nBcH" },
      { name: "DANA", number: "0882 1599 3544", copy: "088215993544", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEjXur82-Ithr--hcBvVeoVrnkXOOlMCyFMKGbK7vgciysVhk1v01In0Ss0l6u3B5mfSbcHi0kj8LyGqJKRwE_BgfPQFPq9xg_vIe9wUVsWSeIQZi6xaseE0GAnwl2n3nmJmbAcq2Ovr92JzZ663bH4ugSiF7FZ8BpKh09yRC-SJVAedJSSTmTB-EMZLMeWs" },
      { name: "ShopeePay", number: "0882 1599 3544", copy: "088215993544", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEgW7BuN7el3v1EBYrI4hZ6NOiMZ-PA4quG8Yf6Hg3fde69_r-XWtiikm-596QLg58iu0YnNcCWFzj4N0FF2lTd_G2ptYP9gHYrrZHndbmuKFctv54LQc-OaXlNP-by8vndGL-Vy9RZE2Yodw33u9lCdYzmMlDHvwRx4NltZBxasQT_yC5K9FbTkg5HwnJbi" },
      { name: "LinkAja", number: "0882 1599 3544", copy: "088215993544", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEi6_Dj1-t2itD5VXaskuXhDquciUjmUlBS_gO67JMRen5mZaT9YSiF7MKzB1LdfMlEDP1M50YcDpTPCuDMx64woMcTeG7PFw6czwoN4OPIB9do06uf0LkRDlVWPLa03shIrTWwZ-xG735lDTvu9pb6aGOX3jSdb_XNrNVMceTZafxwLTFCiNn8IJefrDI0L" }
    ];

    const bankAccounts = [
      { name: "Bank Jago", code: "Kode bank 542", number: "1006 4533 1871", copy: "100645331871", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEicp5KjFo3ZeLilov-1mOt_bH5x-Wbb5Xslnu4BeGJFNC66xaJU6GzXP6V101Q7Jm4sLII7iJ-6towfvzPTenVDHKM3pSRUg-f3PbkDSSNnux45W1wVmNQiqntiBX8ifEuXNUuHquRa8z9lmM0t4ua8bL6_30bVOt5614DGMtNhseV3_X1pRe-7icK1lBWX" },
      { name: "SeaBank", code: "Kode bank 535", number: "9013 7594 0437", copy: "901375940437", logo: "https://blogger.googleusercontent.com/img/a/AVvXsEi18PxWNHMFpvNCr707T_va5y6AkUoOnJkGJy7jXB3CwowK5DcSvDLANFHk9CEy8mthpHUtDVeRQkZXjNLTksJUPrfyoEdoK94WgLNaNmtTJ4Kq46BUxBJXCQACinJSgyRz0lc_1-XUt_EGr-O--Uwh86_h3XiV-axvrWON0HTeQoRtYVGSOI9tyzC8CxRO" }
    ];

    const content = document.querySelector("#content");
    const toast = document.querySelector("#toast");

    function viewHeader(label, title, description) {
      return `<header class="view-header"><span class="eyebrow">${label}</span><h1>${title}</h1><p>${description}</p></header>`;
    }


    function qrisOwnerBox() {
      return `<div class="owner-box"><span class="owner-icon">✓</span><div><small>ATAS NAMA QRIS</small><strong>Babayshop.id</strong></div></div>`;
    }

    function accountCard(account) {
      return `
        <article class="account">
          <img class="account-logo" src="${account.logo}" alt="Logo ${account.name}" loading="lazy">
          <div>
            <div class="account-name"><strong>${account.name}</strong>${account.code ? `<span class="bank-code">${account.code}</span>` : ""}</div>
            <div class="account-number">${account.number}</div>
            <div class="account-owner">a.n. ${OWNER_NAME}</div>
          </div>
          <button class="copy-button" type="button" data-copy="${account.copy}" aria-label="Salin nomor ${account.name}">Salin</button>
        </article>`;
    }

    function render(view) {
      document.querySelectorAll("[data-view]").forEach(button => {
        const active = button.dataset.view === view;
        button.classList.toggle("active", active);
        button.setAttribute("aria-current", active ? "page" : "false");
      });

      if (view === "qris") {
        content.innerHTML = `<div class="view">${viewHeader("QRIS", "Bayar lebih praktis", "Scan kode QR menggunakan aplikasi pembayaran pilihan Anda.")}<div class="qris-layout"><div class="qris-box"><img src="${QRIS_IMAGE}" alt="Kode QRIS BabayShop.id"></div><div class="instruction"><h2>Scan QRIS</h2><p>Buka aplikasi pembayaran, scan kode QR, lalu masukkan nominal sesuai transaksi.</p>${qrisOwnerBox()}</div></div></div>`;
      } else if (view === "ewallet" || view === "bank") {
        const isWallet = view === "ewallet";
        const accounts = isWallet ? ewalletAccounts : bankAccounts;
        content.innerHTML = `<div class="view">${viewHeader(isWallet ? "E-WALLET" : "TRANSFER BANK", isWallet ? "Pilih e-wallet" : "Pilih rekening bank", `Pastikan nama penerima tercantum sebagai ${OWNER_NAME}.`)}<div class="account-list">${accounts.map(accountCard).join("")}</div>${ownerBox()}</div>`;
      } else {
        content.innerHTML = `<div class="view">${viewHeader("ADMIN", "Butuh bantuan?", "Hubungi admin resmi BabayShop.id untuk konfirmasi atau kendala pembayaran.")}<div class="admin-panel"><img class="admin-logo" src="${SHOP_LOGO}" alt="Logo BabayShop"><h2>Admin BabayShop</h2><strong class="admin-phone">${ADMIN_PHONE_DISPLAY}</strong><p>Kami siap membantu proses pembayaran Anda.</p><a class="whatsapp-button" href="https://wa.me/${ADMIN_PHONE_WHATSAPP}" target="_blank" rel="noopener noreferrer">Chat WhatsApp ↗</a></div></div>`;
      }

      history.replaceState(null, "", `#${view}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function copyNumber(button) {
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1800);
      } catch {
        window.prompt("Salin nomor berikut:", button.dataset.copy);
      }
    }

    document.addEventListener("click", event => {
      const navigationButton = event.target.closest("[data-view]");
      const copyButton = event.target.closest("[data-copy]");
      if (navigationButton) render(navigationButton.dataset.view);
      if (copyButton) copyNumber(copyButton);
    });

    const requestedView = window.location.hash.slice(1);
    const validViews = ["qris", "ewallet", "bank", "admin"];
    render(validViews.includes(requestedView) ? requestedView : "qris");
  </script>
</body>
</html>
